# JDK 17 on Windows decodes launcher argument files using the native codepage.
# Keep its native default so Gradle worker classpaths with Chinese directories survive.
# Kotlin sources use UTF-8; javac encoding is explicit in app/build.gradle.kts.
org.gradle.jvmargs=-Xmx2048m
org.gradle.parallel=true
kotlin.code.style=official
android.useAndroidX=false
# The existing workspace has a non-ASCII path. Keep that directory intact.
android.overridePathCheck=true
